<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efe Gold | Canlı Pano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Orbitron:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; }
        .gold-card { background: white; border: 1px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: all 0.3s ease; }
        .update-flash { animation: flash 0.8s ease-out; }
        @keyframes flash { 0% { background-color: #fef3c7; } 100% { background-color: white; } }
        .price-font { font-family: 'Orbitron', sans-serif; letter-spacing: -1px; }
        header { background: white; border-bottom: 4px solid #b45309; }
    </style>
</head>
<body class="min-h-screen">

    <header class="p-5 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-black tracking-tighter uppercase italic text-slate-800">
                    <span class="text-amber-600">EFE GOLD</span> KUYUMCU
                </h1>
                <div class="flex items-center gap-2 mt-1">
                    <span id="date" class="text-[10px] text-slate-400 font-bold uppercase tracking-widest italic">Yükleniyor...</span>
                    <span id="status-dot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                    <span id="status-text" class="text-[9px] font-bold text-amber-600 uppercase italic">Bağlanıyor</span>
                </div>
            </div>
            <div class="text-right">
                <div id="clock" class="text-2xl font-black text-slate-700 price-font italic">00:00:00</div>
                <p class="text-[8px] text-slate-400 font-bold uppercase tracking-tighter">10 Saniyede Bir Güncellenir</p>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <div id="price-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            </div>
    </main>

    <footer class="p-6 text-center text-slate-300 text-[9px] font-bold tracking-[0.4em] uppercase">
        © 2026 EFE GOLD KUYUMCU - ŞANLIURFA / KARAKÖPRÜ
    </footer>

    <script>
        // --- AYARLAR ---
        const SATIS_FARKI = 80; 
        const ALIS_FARKI = 20;

        const URUNLER = [
            { id: "gram-altin", ad: "Has Altın (24A)", icon: "fa-coins", type: "gold" },
            { id: "22-ayar-bilezik", ad: "22 Ayar Bilezik", icon: "fa-ring", type: "gold" },
            { id: "18-ayar-altin", ad: "18 Ayar Altın", icon: "fa-gem", type: "gold" },
            { id: "14-ayar-altin", ad: "14 Ayar Altın", icon: "fa-gem", type: "gold" },
            { id: "ceyrek-altin", ad: "Yeni Çeyrek", icon: "fa-dot-circle", type: "gold" },
            { id: "yarim-altin", ad: "Yeni Yarım", icon: "fa-adjust", type: "gold" },
            { id: "tam-altin", ad: "Yeni Tam", icon: "fa-circle", type: "gold" },
            { id: "ata-altin", ad: "Ata Lira", icon: "fa-crown", type: "gold" },
            { id: "USD", ad: "ABD Doları", icon: "fa-dollar-sign", type: "currency" },
            { id: "EUR", ad: "Euro", icon: "fa-euro-sign", type: "currency" }
        ];

        // Ekranın beyaz kalmaması için "Başlangıç Verileri"
        let currentData = {
            "gram-altin": { Alış: "2.450,00", Satış: "2.460,00" },
            "22-ayar-bilezik": { Alış: "2.250,00", Satış: "2.280,00" },
            "18-ayar-altin": { Alış: "1.850,00", Satış: "1.900,00" },
            "14-ayar-altin": { Alış: "1.450,00", Satış: "1.500,00" },
            "ceyrek-altin": { Alış: "4.050,00", Satış: "4.120,00" },
            "yarim-altin": { Alış: "8.100,00", Satış: "8.240,00" },
            "tam-altin": { Alış: "16.200,00", Satış: "16.480,00" },
            "ata-altin": { Alış: "16.500,00", Satış: "16.700,00" },
            "USD": { Alış: "32,50", Satış: "32,60" },
            "EUR": { Alış: "35,10", Satış: "35,25" }
        };

        async function fetchData() {
            try {
                // Cache engellemek için her seferinde farklı bir URL (?v=...)
                const proxy = "https://api.allorigins.win/get?url=";
                const target = encodeURIComponent(`https://finans.truncgil.com/today.json?v=${Date.now()}`);
                
                const response = await fetch(proxy + target);
                const result = await response.json();
                const data = JSON.parse(result.contents);

                if (data && data["gram-altin"]) {
                    currentData = data;
                    renderUI();
                    updateStatus(true);
                }
            } catch (e) {
                console.warn("Bağlantı denendi, internet bekleniyor...");
                updateStatus(false);
            }
        }

        function renderUI() {
            const grid = document.getElementById('price-grid');
            let html = '';

            URUNLER.forEach(item => {
                const source = currentData[item.id];
                if (!source) return;

                let buy = parseFloat(source.Alış.replace('.', '').replace(',', '.'));
                let sell = parseFloat(source.Satış.replace('.', '').replace(',', '.'));

                if (item.type === "gold") {
                    buy = buy - ALIS_FARKI;
                    sell = sell + SATIS_FARKI;
                }

                html += `
                    <div class="gold-card p-5 update-flash">
                        <div class="flex justify-between items-center mb-4">
                            <div class="w-10 h-10 bg-amber-50 rounded-xl flex items-center justify-center border border-amber-100">
                                <i class="fas ${item.icon} text-amber-600 text-lg"></i>
                            </div>
                            <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">${item.ad}</span>
                        </div>
                        <div class="flex justify-between items-end">
                            <div class="flex flex-col">
                                <span class="text-[8px] text-slate-400 font-bold mb-1 italic uppercase">Alış</span>
                                <span class="price-font text-lg font-bold text-slate-600">${format(buy)}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-[8px] text-amber-600 font-bold mb-1 italic uppercase">Satış</span>
                                <span class="price-font text-2xl font-black text-slate-900 tracking-tighter">${format(sell)}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function updateStatus(isOk) {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            if (isOk) {
                dot.className = "w-2 h-2 rounded-full bg-green-500";
                txt.innerText = "Sistem Canlı";
                txt.className = "text-[9px] font-bold text-green-600 uppercase italic";
            } else {
                dot.className = "w-2 h-2 rounded-full bg-red-500 animate-pulse";
                txt.innerText = "Bağlantı Hatası";
                txt.className = "text-[9px] font-bold text-red-600 uppercase italic";
            }
        }

        function format(num) {
            return num.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('tr-TR');
            document.getElementById('date').innerText = now.toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric'});
        }

        // --- BAŞLATMA ---
        setInterval(updateClock, 1000);
        setInterval(fetchData, 10000); // 10 saniyede bir yeni fiyat çek

        updateClock();
        renderUI(); // Sayfa açılır açılmaz örnek verilerle kartları oluştur (Beyaz ekranı engeller)
        fetchData(); // Hemen gerçek verileri çekmeye başla
    </script>
</body>
</html>
