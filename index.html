<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efe Gold | Canlı Fiyat Panosu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Orbitron:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; }
        .gold-card { background: white; border: 1px solid #e2e8f0; border-radius: 1.25rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: 0.3s; }
        .price-font { font-family: 'Orbitron', sans-serif; }
        .text-gold { color: #b45309; }
        .update-flash { animation: flash 0.8s ease-out; }
        @keyframes flash { 0% { background-color: #fef3c7; } 100% { background-color: white; } }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body class="min-h-screen">

    <header class="bg-white border-b-4 border-amber-600 p-5 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-black tracking-tighter uppercase italic text-slate-800">
                    <span class="text-amber-600">EFE GOLD</span> KUYUMCU
                </h1>
                <div class="flex items-center gap-2 mt-1">
                    <span id="date" class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Yükleniyor...</span>
                    <span id="sync-status" class="status-dot bg-amber-500"></span>
                    <span id="status-text" class="text-[9px] font-bold text-amber-600 uppercase italic">Bağlanıyor</span>
                </div>
            </div>
            <div class="text-right">
                <div id="clock" class="text-2xl font-black text-slate-700 price-font italic">00:00:00</div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-8">
        <div id="price-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <footer class="p-8 text-center text-slate-400 text-[10px] font-bold tracking-[0.3em] uppercase mt-10">
        © 2026 EFE GOLD KUYUMCU - ŞANLIURFA
    </footer>

    <script>
        // --- GİZLİ AYARLAR ---
        const SATIS_FARKI = 250; 
        const ALIS_FARKI = 20;
        
        const URUNLER = [
            { id: "gram-altin", ad: "Gram Altın (24A)", icon: "fa-coins", type: "gold" },
            { id: "22-ayar-bilezik", ad: "22 Ayar Bilezik", icon: "fa-ring", type: "gold" },
            { id: "ceyrek-altin", ad: "Çeyrek Altın", icon: "fa-dot-circle", type: "gold" },
            { id: "yarim-altin", ad: "Yarım Altın", icon: "fa-adjust", type: "gold" },
            { id: "tam-altin", ad: "Tam Altın", icon: "fa-circle", type: "gold" },
            { id: "gumus", ad: "Has Gümüş (GR)", icon: "fa-gem", type: "other" },
            { id: "USD", ad: "ABD Doları", icon: "fa-dollar-sign", type: "currency" },
            { id: "EUR", ad: "Euro", icon: "fa-euro-sign", type: "currency" }
        ];

        // Eğer API geç cevap verirse ekran boş kalmasın diye başlangıç verileri
        let lastKnownData = null;

        async function fetchData() {
            const statusDot = document.getElementById('sync-status');
            const statusText = document.getElementById('status-text');
            
            try {
                // Alternatif ve daha hızlı bir proxy yöntemi
                const cacheBuster = Math.random();
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://finans.truncgil.com/today.json?v=' + cacheBuster)}`);
                
                if (!response.ok) throw new Error("Ağ hatası");
                
                const result = await response.json();
                const data = JSON.parse(result.contents);

                lastKnownData = data;
                renderUI(data);

                statusDot.className = 'status-dot bg-green-500';
                statusText.innerText = "Canlı";
                statusText.className = "text-[9px] font-bold text-green-600 uppercase italic";
            } catch (error) {
                console.error("Veri çekilemedi:", error);
                statusDot.className = 'status-dot bg-red-500';
                statusText.innerText = "Bağlantı Hatası";
                statusText.className = "text-[9px] font-bold text-red-600 uppercase italic";
                
                // Eğer hata alırsak ve elimizde eski veri varsa onu göster
                if(lastKnownData) renderUI(lastKnownData);
            }
        }

        function renderUI(data) {
            const grid = document.getElementById('price-grid');
            let html = '';

            URUNLER.forEach(item => {
                const source = data[item.id];
                if (!source) return;

                let buy = parseFloat(source.Alış.replace('.', '').replace(',', '.'));
                let sell = parseFloat(source.Satış.replace('.', '').replace(',', '.'));

                // Gizli kâr hesaplama (Sadece altın türlerinde)
                if (item.type === "gold") {
                    buy = buy - ALIS_FARKI;
                    sell = sell + SATIS_FARKI;
                }

                html += `
                    <div class="gold-card p-6 update-flash">
                        <div class="flex justify-between items-center mb-6">
                            <div class="w-10 h-10 bg-amber-50 rounded-xl flex items-center justify-center border border-amber-100">
                                <i class="fas ${item.icon} text-amber-600 text-lg"></i>
                            </div>
                            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest text-right">${item.ad}</span>
                        </div>
                        <div class="flex justify-between items-end">
                            <div class="flex flex-col">
                                <span class="text-[9px] text-slate-400 font-black mb-1">ALIŞ</span>
                                <span class="price-font text-xl font-bold text-slate-600">${format(buy)}</span>
                            </div>
                            <div class="flex flex-col text-right">
                                <span class="text-[9px] text-amber-600 font-black mb-1 uppercase italic">SATIŞ</span>
                                <span class="price-font text-3xl font-extrabold text-slate-900 tracking-tighter">${format(sell)}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function format(num) {
            return num.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('tr-TR');
            document.getElementById('date').innerText = now.toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric'});
        }

        // Zamanlayıcılar
        setInterval(updateClock, 1000);
        setInterval(fetchData, 20000); // 20 saniyede bir yeni veri çek

        // Başlat
        updateClock();
        fetchData();
    </script>
</body>
</html>
