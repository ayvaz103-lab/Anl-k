<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EFE GOLD | CANLI PİYASA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold:          #C9A84C;
    --gold-light:    #E2C97E;
    --gold-dark:     #8B6508;
    --gold-shine:    #F5E09A;
    --bg:            #0D0F14;
    --bg2:           #141720;
    --bg3:           #1A1E2A;
    --panel:         #181B26;
    --panel2:        #1E2230;
    --border:        rgba(201,168,76,0.18);
    --border-bright: rgba(201,168,76,0.55);
    --text:          #F0EAD6;
    --text2:         #C8C0A8;
    --muted:         #7A7560;
    --up:            #22C55E;
    --up-bg:         rgba(34,197,94,0.10);
    --up-border:     rgba(34,197,94,0.35);
    --down:          #EF4444;
    --down-bg:       rgba(239,68,68,0.10);
    --down-border:   rgba(239,68,68,0.35);
    --neutral:       #7A7560;
    --header-height: 90px;
    --footer-height: 48px;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ─── ARKA PLAN DOKU ─── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(201,168,76,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 100% 100%, rgba(201,168,76,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ─── HEADER ─── */
  header {
    position: relative;
    z-index: 10;
    background: linear-gradient(135deg, #0F1118 0%, #161A26 60%, #0F1118 100%);
    border-bottom: 2px solid var(--border);
    box-shadow: 0 4px 32px rgba(0,0,0,0.6), 0 1px 0 rgba(201,168,76,0.15);
    padding: 0 2.5vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    height: var(--header-height);
    overflow: visible;
    transition: background 0.5s, box-shadow 0.5s;
  }

  /* Header yükseliş/düşüş efekti */
  header.header-up {
    background: linear-gradient(135deg, #0A1510 0%, #0F2018 60%, #0A1510 100%);
    box-shadow: 0 4px 40px rgba(34,197,94,0.12), 0 0 0 1px rgba(34,197,94,0.2);
    border-bottom-color: rgba(34,197,94,0.4);
  }
  header.header-down {
    background: linear-gradient(135deg, #150A0A 0%, #201010 60%, #150A0A 100%);
    box-shadow: 0 4px 40px rgba(239,68,68,0.12), 0 0 0 1px rgba(239,68,68,0.2);
    border-bottom-color: rgba(239,68,68,0.4);
  }

  /* Altın şerit üstte */
  header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent 0%, var(--gold-dark) 20%, var(--gold-light) 50%, var(--gold-dark) 80%, transparent 100%);
  }
  header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(201,168,76,0.6) 50%, transparent 100%);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  .logo-emblem {
    width: 58px; height: 58px;
    background: linear-gradient(145deg, var(--gold-light), var(--gold-dark));
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: #0D0F14;
    flex-shrink: 0;
    box-shadow: 0 0 24px rgba(201,168,76,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
    position: relative;
  }
  .logo-emblem::after {
    content: '';
    position: absolute;
    inset: 2px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    pointer-events: none;
  }

  .logo-text h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 2.8vw, 3rem);
    letter-spacing: 5px;
    background: linear-gradient(135deg, var(--gold-shine) 0%, var(--gold) 50%, var(--gold-dark) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }
  .logo-text p {
    font-size: 0.72rem;
    letter-spacing: 4px;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 3px;
  }

  /* ─── TICKER MERKEZ ─── */
  .header-center {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 0 2vw;
  }

  .ticker-bar {
    display: flex;
    gap: 0;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  }

  .ticker-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 10px 24px;
    border-right: 1px solid var(--border);
    position: relative;
  }
  .ticker-item:last-child { border-right: none; }

  .ticker-label {
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .ticker-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: -0.5px;
  }
  .ticker-val.up   { color: var(--up);   }
  .ticker-val.down { color: var(--down); }

  /* ─── SAAT/TARİH ─── */
  .header-right {
    text-align: right;
    flex-shrink: 0;
  }
  #clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(1.8rem, 2.5vw, 2.8rem);
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 2px;
    line-height: 1;
    text-shadow: 0 0 20px rgba(201,168,76,0.4);
  }
  #date {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* ─── ANA GRID ─── */
  main {
    flex: 1;
    position: relative;
    z-index: 1;
    padding: 1.2vw 1.8vw;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 1vw;
    overflow: hidden;
  }

  /* ─── FİYAT KARTI ─── */
  .price-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.2vw 1.4vw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    transition: border-color 0.4s ease, background 0.4s ease, box-shadow 0.4s ease;
    box-shadow: 0 2px 16px rgba(0,0,0,0.4);
  }

  /* Üst aksanlı çizgi */
  .price-card::before {
    content: '';
    position: absolute;
    top: 0; left: 12%; right: 12%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.5;
    transition: opacity 0.4s, background 0.4s;
  }
  .price-card.up::before   { background: linear-gradient(90deg, transparent, var(--up), transparent);   opacity: 0.9; }
  .price-card.down::before { background: linear-gradient(90deg, transparent, var(--down), transparent); opacity: 0.9; }

  /* Sol dikey aksanlı çizgi */
  .price-card::after {
    content: '';
    position: absolute;
    top: 20%; bottom: 20%; left: 0; width: 2px;
    background: var(--gold);
    opacity: 0.25;
    border-radius: 0 2px 2px 0;
    transition: background 0.4s, opacity 0.4s;
  }
  .price-card.up::after   { background: var(--up);   opacity: 0.7; }
  .price-card.down::after { background: var(--down); opacity: 0.7; }

  .price-card.up {
    border-color: var(--up-border);
    background: linear-gradient(160deg, #181B26 0%, #0E1A12 100%);
    box-shadow: 0 2px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(34,197,94,0.12);
  }
  .price-card.down {
    border-color: var(--down-border);
    background: linear-gradient(160deg, #181B26 0%, #1A0E0E 100%);
    box-shadow: 0 2px 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(239,68,68,0.12);
  }

  /* ─── KART ÜST ─── */
  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .card-icon-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card-icon {
    width: 34px; height: 34px;
    background: rgba(201,168,76,0.10);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--gold);
    flex-shrink: 0;
    transition: background 0.4s, border-color 0.4s;
  }
  .price-card.up   .card-icon { background: rgba(34,197,94,0.10);   border-color: var(--up-border);   color: var(--up);   }
  .price-card.down .card-icon { background: rgba(239,68,68,0.10);   border-color: var(--down-border); color: var(--down); }

  .card-name {
    font-size: clamp(0.85rem, 1.1vw, 1.2rem);
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .card-type {
    font-size: 0.62rem;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ─── DEĞİŞİM ROZET ─── */
  .change-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 9px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 2px;
    transition: all 0.3s;
  }
  .change-badge.up      { background: var(--up-bg);   color: var(--up);   border: 1px solid var(--up-border);   }
  .change-badge.down    { background: var(--down-bg); color: var(--down); border: 1px solid var(--down-border); }
  .change-badge.neutral { background: rgba(120,115,96,0.12); color: var(--muted); border: 1px solid rgba(120,115,96,0.2); }

  /* ─── FİYAT BÖLGESİ ─── */
  .card-prices {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-top: 8px;
  }

  .price-col {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .price-col.right { text-align: right; }

  .price-label {
    font-size: 0.62rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .alis-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(1.1rem, 1.7vw, 2rem);
    font-weight: 700;
    color: #60A5FA;
    line-height: 1;
    letter-spacing: -1px;
    transition: color 0.3s;
  }

  .satis-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(1.5rem, 2.5vw, 2.8rem);
    font-weight: 700;
    color: var(--gold-light);
    line-height: 1;
    letter-spacing: -2px;
    transition: color 0.3s;
  }
  .price-card.up   .satis-val { color: var(--up);   }
  .price-card.down .satis-val { color: var(--down); }

  .divider-line {
    width: 1px;
    height: 44px;
    background: linear-gradient(to bottom, transparent, var(--border), transparent);
    margin: 0 8px;
    align-self: center;
    flex-shrink: 0;
  }

  /* ─── PARA BİRİMİ SEMBOLÜ ─── */
  .currency-unit {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 2px;
    margin-top: 2px;
    text-transform: uppercase;
  }

  /* ─── FLASH ANİMASYONLAR ─── */
  @keyframes flash-up {
    0%   { box-shadow: 0 0 0 3px rgba(34,197,94,0.4), 0 2px 24px rgba(0,0,0,0.5); }
    60%  { box-shadow: 0 0 0 6px rgba(34,197,94,0.15), 0 2px 24px rgba(0,0,0,0.5); }
    100% { box-shadow: 0 2px 24px rgba(0,0,0,0.5); }
  }
  @keyframes flash-down {
    0%   { box-shadow: 0 0 0 3px rgba(239,68,68,0.4), 0 2px 24px rgba(0,0,0,0.5); }
    60%  { box-shadow: 0 0 0 6px rgba(239,68,68,0.15), 0 2px 24px rgba(0,0,0,0.5); }
    100% { box-shadow: 0 2px 24px rgba(0,0,0,0.5); }
  }

  @keyframes pulse-up {
    0%, 100% { text-shadow: 0 0 8px rgba(34,197,94,0.6); }
    50%       { text-shadow: 0 0 20px rgba(34,197,94,0.9), 0 0 40px rgba(34,197,94,0.3); }
  }
  @keyframes pulse-down {
    0%, 100% { text-shadow: 0 0 8px rgba(239,68,68,0.6); }
    50%       { text-shadow: 0 0 20px rgba(239,68,68,0.9), 0 0 40px rgba(239,68,68,0.3); }
  }

  .flash-up   { animation: flash-up   1.4s ease-out; }
  .flash-down { animation: flash-down 1.4s ease-out; }
  .pulse-up   { animation: pulse-up   1.4s ease-in-out; }
  .pulse-down { animation: pulse-down 1.4s ease-in-out; }

  /* ─── HEADER FLASH ─── */
  @keyframes header-pulse-up {
    0%   { box-shadow: 0 4px 40px rgba(34,197,94,0.20); }
    50%  { box-shadow: 0 4px 60px rgba(34,197,94,0.40); }
    100% { box-shadow: 0 4px 40px rgba(34,197,94,0.20); }
  }
  @keyframes header-pulse-down {
    0%   { box-shadow: 0 4px 40px rgba(239,68,68,0.20); }
    50%  { box-shadow: 0 4px 60px rgba(239,68,68,0.40); }
    100% { box-shadow: 0 4px 40px rgba(239,68,68,0.20); }
  }

  /* ─── FOOTER ─── */
  footer {
    position: relative;
    z-index: 10;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    padding: 0 2.5vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    height: var(--footer-height);
  }
  footer::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,168,76,0.4), transparent);
  }

  .footer-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .live-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--up);
    animation: blink 1.5s infinite;
    flex-shrink: 0;
    box-shadow: 0 0 6px var(--up);
  }
  .live-dot.error   { background: var(--down); animation: none; box-shadow: 0 0 6px var(--down); }
  .live-dot.loading { background: var(--gold); box-shadow: 0 0 6px var(--gold); }

  @keyframes blink {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--up); }
    50%       { opacity: 0.3; box-shadow: 0 0 2px var(--up); }
  }

  #status-text {
    font-size: 0.68rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }
  #last-update {
    font-size: 0.62rem;
    letter-spacing: 2px;
    color: var(--muted);
    opacity: 0.6;
    margin-left: 16px;
  }

  .footer-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .footer-loc {
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .refresh-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 16px;
    border-radius: 6px;
    font-size: 0.68rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .refresh-btn:hover {
    border-color: var(--border-bright);
    color: var(--gold);
    background: rgba(201,168,76,0.06);
  }
  .refresh-btn.spinning i { animation: spin 0.6s linear infinite; }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ─── COUNTDOWN BAR ─── */
  .countdown-bar {
    position: absolute;
    bottom: 0; left: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold-light));
    transition: width 1s linear;
    border-radius: 0 2px 0 0;
    opacity: 0.6;
  }

  /* ─── YÜKLEME İSKELETİ ─── */
  .skeleton {
    display: inline-block;
    background: linear-gradient(90deg,
      var(--panel) 25%,
      rgba(201,168,76,0.06) 50%,
      var(--panel) 75%
    );
    background-size: 200% 100%;
    animation: shimmer 1.6s infinite;
    border-radius: 6px;
    vertical-align: middle;
  }
  @keyframes shimmer {
    0%   { background-position: -200% 0; }
    100% { background-position:  200% 0; }
  }

  /* ─── ARKA PLAN YAZISI ─── */
  .bg-logo {
    position: fixed;
    bottom: 50px;
    right: -2vw;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20vw;
    color: rgba(201,168,76,0.025);
    pointer-events: none;
    letter-spacing: 10px;
    line-height: 1;
    user-select: none;
    z-index: 0;
  }

  /* ─── BAĞLANTI HATASI OVERLAY ─── */
  #error-overlay {
    display: none;
    position: fixed;
    bottom: var(--footer-height);
    left: 0; right: 0;
    background: rgba(239,68,68,0.08);
    border-top: 1px solid rgba(239,68,68,0.25);
    padding: 8px 2.5vw;
    z-index: 20;
    align-items: center;
    gap: 12px;
    font-size: 0.72rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--down);
  }
  #error-overlay.visible { display: flex; }

  /* ─── SON GÜNCELLENDİ BADGE ─── */
  .update-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(201,168,76,0.06);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 8px;
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 6px;
  }
</style>
</head>
<body>

<!-- Arka plan dekorasyon -->
<div class="bg-logo">EFE</div>

<!-- ═══ HEADER ═══ -->
<header id="main-header">
  <div class="header-left">
    <div class="logo-emblem">
      <i class="fas fa-vault"></i>
    </div>
    <div class="logo-text">
      <h1>EFE GOLD</h1>
      <p>Kuyumcu &bull; Karaköprü &bull; Şanlıurfa</p>
    </div>
  </div>

  <div class="header-center">
    <div class="ticker-bar">
      <div class="ticker-item">
        <span class="ticker-label"><i class="fas fa-sun"></i>&nbsp; Sabah Referans</span>
        <span class="ticker-val" id="ref-sab">—</span>
      </div>
      <div class="ticker-item">
        <span class="ticker-label"><i class="fas fa-arrow-trend-up"></i>&nbsp; Gün Yüksek</span>
        <span class="ticker-val up" id="ref-yuk">—</span>
      </div>
      <div class="ticker-item">
        <span class="ticker-label"><i class="fas fa-arrow-trend-down"></i>&nbsp; Gün Düşük</span>
        <span class="ticker-val down" id="ref-dusuk">—</span>
      </div>
      <div class="ticker-item">
        <span class="ticker-label"><i class="fas fa-rotate"></i>&nbsp; Sonraki Güncelleme</span>
        <span class="ticker-val" id="next-update" style="color:var(--text2);">—</span>
      </div>
    </div>
  </div>

  <div class="header-right">
    <div id="clock">00:00:00</div>
    <div id="date">—</div>
  </div>
</header>

<!-- Hata overlay -->
<div id="error-overlay">
  <i class="fas fa-triangle-exclamation"></i>
  <span id="error-msg">Veri alınamadı — Yeniden deneniyor...</span>
</div>

<!-- ═══ GRID ═══ -->
<main id="price-grid"></main>

<!-- ═══ FOOTER ═══ -->
<footer>
  <div class="footer-left">
    <div class="live-dot loading" id="status-dot"></div>
    <span id="status-text">Bağlanıyor...</span>
    <span id="last-update"></span>
  </div>
  <div class="footer-right">
    <span class="footer-loc">
      <i class="fas fa-location-dot" style="color:var(--gold); margin-right:5px;"></i>
      Karaköprü / Şanlıurfa
    </span>
    <button class="refresh-btn" id="refresh-btn" onclick="manualRefresh()">
      <i class="fas fa-rotate"></i> Yenile
    </button>
  </div>
  <div class="countdown-bar" id="countdown-bar"></div>
</footer>

<script>
/* ═══════════════════════════════════════════════
   KAR MARJI AYARLARI
   ─────────────────────────────────────────────
   gold    → Altın ürünleri (TL/gram)
   currency → Döviz kurları (TL)
   ═══════════════════════════════════════════════ */
const KAR = {
  gold:     { alis_dusur: 30,   satis_ekle: 100  },
  currency: { alis_dusur: 0.20, satis_ekle: 0.30 }
};

/* ═══════════════════════════════════════════════
   ÜRÜN TANIMI
   Kaynak API'daki 'id' değerleri ve tip bilgisi
   ═══════════════════════════════════════════════ */
const URUNLER = [
  { id: "gram-altin",      ad: "Gram Altın",      alt: "24 Ayar",             icon: "fa-coins",              type: "gold"     },
  { id: "22-ayar-bilezik", ad: "22 Ayar Bilezik", alt: "Gram",                icon: "fa-ring",               type: "gold"     },
  { id: "ata-altin",       ad: "Cumhuriyet Altın",alt: "Ata Lira",            icon: "fa-crown",              type: "gold"     },
  { id: "ceyrek-altin",    ad: "Eski Çeyrek",     alt: "Cumhuriyet Altını",   icon: "fa-circle-half-stroke", type: "gold"     },
  { id: "ceyrek-altin",    ad: "Yeni Çeyrek",     alt: "Cumhuriyet Altını",   icon: "fa-circle-half-stroke", type: "gold",    newStyle: true },
  { id: "yarim-altin",     ad: "Yeni Yarım",      alt: "Cumhuriyet Altını",   icon: "fa-adjust",             type: "gold"     },
  { id: "tam-altin",       ad: "Yeni Tam",        alt: "Cumhuriyet Altını",   icon: "fa-circle",             type: "gold"     },
  { id: "USD",             ad: "Dolar",            alt: "ABD / USD",           icon: "fa-dollar-sign",        type: "currency" },
];

/* ═══════════════════════════════════════════════
   DURUM DEĞİŞKENLERİ
   ═══════════════════════════════════════════════ */
const prevPrices  = {};
let gunYuksek     = 0;
let gunDusuk      = Infinity;
let sabahRef      = null;
let headerDir     = 'neutral';
let headerTimer   = null;
let countdownSec  = 10;
let countdownInt  = null;
let isFetching    = false;
let consecutiveFail = 0;

/* ═══════════════════════════════════════════════
   YARDIMCI FONKSİYONLAR
   ═══════════════════════════════════════════════ */
function fmt(n, dec = 2) {
  if (isNaN(n) || n === null || n === undefined) return '—';
  return Number(n).toLocaleString('tr-TR', {
    minimumFractionDigits: dec,
    maximumFractionDigits: dec
  });
}

function parsePrice(str) {
  if (!str) return 0;
  const clean = String(str).trim().replace(/\./g, '').replace(',', '.');
  const num = parseFloat(clean);
  return isNaN(num) ? 0 : num;
}

function nowStr() {
  return new Date().toLocaleTimeString('tr-TR');
}

/* ═══════════════════════════════════════════════
   KART OLUŞTUR
   ═══════════════════════════════════════════════ */
function buildCards() {
  const grid = document.getElementById('price-grid');
  grid.innerHTML = '';
  URUNLER.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'price-card';
    card.id = `card-${i}`;

    const unit = item.type === 'currency' ? 'TL / 1 Birim' : 'TL / Gram';

    card.innerHTML = `
      <div class="card-top">
        <div class="card-icon-wrap">
          <div class="card-icon"><i class="fas ${item.icon}"></i></div>
          <div>
            <div class="card-name">${item.ad}</div>
            <div class="card-type">${item.alt}</div>
          </div>
        </div>
        <div class="change-badge neutral" id="badge-${i}">
          <i class="fas fa-minus" style="font-size:9px;"></i>
          <span>—</span>
        </div>
      </div>
      <div class="card-prices">
        <div class="price-col">
          <div class="price-label"><i class="fas fa-arrow-down" style="font-size:8px;"></i>&nbsp; Alış</div>
          <div class="alis-val" id="alis-${i}">
            <span class="skeleton" style="width:110px; height:28px;"></span>
          </div>
          <div class="currency-unit">${unit}</div>
        </div>
        <div class="divider-line"></div>
        <div class="price-col right">
          <div class="price-label"><i class="fas fa-arrow-up" style="font-size:8px;"></i>&nbsp; Satış</div>
          <div class="satis-val" id="satis-${i}">
            <span class="skeleton" style="width:140px; height:36px;"></span>
          </div>
          <div class="currency-unit">${unit}</div>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

/* ═══════════════════════════════════════════════
   KART GÜNCELLE
   ═══════════════════════════════════════════════ */
function updateCard(i, alis, satis) {
  const key    = `card_${i}`;
  const prev   = prevPrices[key];

  const alisEl  = document.getElementById(`alis-${i}`);
  const satisEl = document.getElementById(`satis-${i}`);
  const badge   = document.getElementById(`badge-${i}`);
  const card    = document.getElementById(`card-${i}`);

  if (!alisEl || !satisEl || !badge || !card) return;

  const item = URUNLER[i];
  const dec  = item.type === 'currency' ? 4 : 2;

  alisEl.textContent  = fmt(alis, dec);
  satisEl.textContent = fmt(satis, dec);

  let direction  = 'neutral';
  let changeText = '—';
  let changeAbs  = 0;

  if (prev && prev.satis !== 0) {
    const diff = satis - prev.satis;
    changeAbs  = diff;

    if (diff > 0.001) {
      direction  = 'up';
      changeText = `+${fmt(diff, dec)}`;
    } else if (diff < -0.001) {
      direction  = 'down';
      changeText = fmt(diff, dec);
    } else {
      direction  = 'neutral';
      changeText = '0,00';
    }

    // Kart renk efekti
    card.classList.remove('up', 'down', 'flash-up', 'flash-down');
    void card.offsetWidth; // reflow

    if (direction === 'up') {
      card.classList.add('up', 'flash-up');
      satisEl.classList.remove('pulse-down');
      void satisEl.offsetWidth;
      satisEl.classList.add('pulse-up');
    } else if (direction === 'down') {
      card.classList.add('down', 'flash-down');
      satisEl.classList.remove('pulse-up');
      void satisEl.offsetWidth;
      satisEl.classList.add('pulse-down');
    }

    // Animasyon temizle
    setTimeout(() => {
      satisEl.classList.remove('pulse-up', 'pulse-down');
    }, 1500);
  }

  // Rozet güncelle
  badge.className = `change-badge ${direction}`;
  const iconCls = direction === 'up' ? 'fa-arrow-trend-up' :
                  direction === 'down' ? 'fa-arrow-trend-down' : 'fa-minus';
  badge.innerHTML = `<i class="fas ${iconCls}" style="font-size:9px;"></i><span>${changeText}</span>`;

  prevPrices[key] = { alis, satis };

  return { direction, changeAbs };
}

/* ═══════════════════════════════════════════════
   HEADER YÖN EFEKTİ
   ═══════════════════════════════════════════════ */
function setHeaderDirection(dir) {
  const hdr = document.getElementById('main-header');
  if (!hdr) return;

  if (dir === headerDir) return;
  headerDir = dir;

  hdr.classList.remove('header-up', 'header-down');
  if (dir === 'up')   hdr.classList.add('header-up');
  if (dir === 'down') hdr.classList.add('header-down');

  clearTimeout(headerTimer);
  // 4 saniye sonra sıfırla
  headerTimer = setTimeout(() => {
    hdr.classList.remove('header-up', 'header-down');
    headerDir = 'neutral';
  }, 4000);
}

/* ═══════════════════════════════════════════════
   VERİ ÇEKME — ÇOKLU FALLBACK ENDPOİNT
   ═══════════════════════════════════════════════ */
const BASE_URL = 'https://finans.truncgil.com/today.json';

const PROXIES = [
  (ts) => `https://api.allorigins.win/raw?url=${encodeURIComponent(BASE_URL + '?t=' + ts)}`,
  ()   => `https://corsproxy.io/?${encodeURIComponent(BASE_URL)}`,
  ()   => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(BASE_URL)}`,
  ()   => `https://thingproxy.freeboard.io/fetch/${BASE_URL}`,
];

async function fetchWithTimeout(url, timeoutMs = 7000) {
  const ctrl = new AbortController();
  const id   = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, {
      signal: ctrl.signal,
      cache: 'no-store',
      headers: { 'Accept': 'application/json' }
    });
    clearTimeout(id);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (e) {
    clearTimeout(id);
    throw e;
  }
}

async function fetchPriceData() {
  const ts = Date.now();

  for (let idx = 0; idx < PROXIES.length; idx++) {
    const url = PROXIES[idx](ts);
    try {
      const data = await fetchWithTimeout(url, 7000);
      // Veri doğrulama
      if (data && (data['gram-altin'] || data['USD'])) {
        consecutiveFail = 0;
        return data;
      }
    } catch (e) {
      console.warn(`[EFE GOLD] Proxy ${idx + 1} başarısız:`, e.message);
    }
  }

  consecutiveFail++;
  throw new Error('Tüm proxy\'ler başarısız oldu');
}

/* ═══════════════════════════════════════════════
   VERİYİ İŞLE
   ═══════════════════════════════════════════════ */
function renderData(data) {
  let upCount   = 0;
  let downCount = 0;

  URUNLER.forEach((item, i) => {
    const info = data[item.id];
    if (!info) return;

    const pAlis  = parsePrice(info['Alış']);
    const pSatis = parsePrice(info['Satış']);
    if (!pAlis && !pSatis) return;

    const k = item.type === 'gold' ? KAR.gold : KAR.currency;
    const sonAlis  = pAlis  - k.alis_dusur;
    const sonSatis = pSatis + k.satis_ekle;

    const result = updateCard(i, sonAlis, sonSatis);
    if (result) {
      if (result.direction === 'up')   upCount++;
      if (result.direction === 'down') downCount++;
    }

    // Gün istatistikleri (gram altın, ilk kart)
    if (item.id === 'gram-altin' && i === 0) {
      if (sabahRef === null) sabahRef = pSatis;
      if (pSatis > gunYuksek) gunYuksek = pSatis;
      if (pSatis < gunDusuk)  gunDusuk  = pSatis;

      document.getElementById('ref-sab').textContent   = sabahRef   ? fmt(sabahRef)  : '—';
      document.getElementById('ref-yuk').textContent   = gunYuksek  > 0          ? fmt(gunYuksek) : '—';
      document.getElementById('ref-dusuk').textContent = gunDusuk   < Infinity   ? fmt(gunDusuk)  : '—';
    }
  });

  // Header yön efekti
  if (upCount > downCount && upCount > 0)        setHeaderDirection('up');
  else if (downCount > upCount && downCount > 0) setHeaderDirection('down');
}

/* ═══════════════════════════════════════════════
   ANA GÜNCELLEME FONKSİYONU
   ═══════════════════════════════════════════════ */
async function updatePrices(manual = false) {
  if (isFetching && !manual) return;
  isFetching = true;

  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  const btn = document.getElementById('refresh-btn');
  const errOverlay = document.getElementById('error-overlay');

  dot.className = 'live-dot loading';
  txt.textContent = 'Veri alınıyor...';
  if (btn) btn.classList.add('spinning');

  try {
    const data = await fetchPriceData();
    renderData(data);

    dot.className = 'live-dot';
    txt.textContent = 'Sistem Aktif — Fiyatlar Canlı';

    const lu = document.getElementById('last-update');
    if (lu) lu.textContent = `Son: ${nowStr()}`;

    if (errOverlay) errOverlay.classList.remove('visible');

  } catch (e) {
    console.error('[EFE GOLD] Güncelleme hatası:', e);
    dot.className = 'live-dot error';
    txt.textContent = 'Bağlantı Hatası';

    if (errOverlay) {
      errOverlay.classList.add('visible');
      const msg = document.getElementById('error-msg');
      if (msg) msg.textContent = consecutiveFail > 2
        ? 'İnternet bağlantısını kontrol edin — Birden fazla deneme başarısız'
        : 'Sunucuya ulaşılamadı — 10 saniye sonra tekrar denenecek';
    }
  } finally {
    isFetching = false;
    if (btn) btn.classList.remove('spinning');
  }
}

/* ═══════════════════════════════════════════════
   MANUEL YENİLE
   ═══════════════════════════════════════════════ */
function manualRefresh() {
  // Sayacı sıfırla
  countdownSec = 10;
  updateCountdownBar();
  updatePrices(true);
}

/* ═══════════════════════════════════════════════
   SAYAÇ & PROGRESS BAR
   ═══════════════════════════════════════════════ */
function updateCountdownBar() {
  const bar = document.getElementById('countdown-bar');
  const nxt = document.getElementById('next-update');
  if (bar) bar.style.width = `${(countdownSec / 10) * 100}%`;
  if (nxt) nxt.textContent = `${countdownSec}s`;
}

function startCountdown() {
  clearInterval(countdownInt);
  countdownSec = 10;
  updateCountdownBar();

  countdownInt = setInterval(() => {
    countdownSec--;
    if (countdownSec < 0) countdownSec = 10;
    updateCountdownBar();
  }, 1000);
}

/* ═══════════════════════════════════════════════
   SAAT & TARİH
   ═══════════════════════════════════════════════ */
function setClock() {
  const now = new Date();
  const clk = document.getElementById('clock');
  const dt  = document.getElementById('date');
  if (clk) clk.textContent = now.toLocaleTimeString('tr-TR');
  if (dt)  dt.textContent  = now.toLocaleDateString('tr-TR', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });
}

/* ═══════════════════════════════════════════════
   BAŞLANGIC
   ═══════════════════════════════════════════════ */
buildCards();
setClock();
setInterval(setClock, 1000);

// İlk yükleme
updatePrices();

// 10 saniyede bir otomatik güncelleme
setInterval(() => {
  countdownSec = 10;
  updatePrices();
}, 10000);

// Geri sayım başlat
startCountdown();
</script>
</body>
</html>
