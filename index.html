<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efe Gold | Canlı Pano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Orbitron:wght@700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; }
        
        .gold-card { 
            background: white; 
            border: 1px solid #e2e8f0; 
            border-radius: 1.25rem; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); 
            transition: all 0.4s ease;
        }

        /* Fiyat değiştiğinde parlayacak olan animasyon */
        .update-flash { animation: flash 1s ease-out; }
        @keyframes flash { 
            0% { background-color: #fef3c7; border-color: #d4af37; transform: scale(1.02); } 
            100% { background-color: white; transform: scale(1); } 
        }

        .price-font { font-family: 'Orbitron', sans-serif; letter-spacing: -1px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        
        header { background: white; border-bottom: 4px solid #b45309; }
    </style>
</head>
<body class="min-h-screen">

    <header class="p-5 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-3xl md:text-4xl font-black tracking-tighter uppercase italic text-slate-800">
                    <span class="text-amber-600">EFE GOLD</span> KUYUMCU
                </h1>
                <div class="flex items-center gap-3 mt-1">
                    <span id="date" class="text-[11px] text-slate-400 font-bold uppercase tracking-widest italic">Yükleniyor...</span>
                    <span id="sync-status" class="status-dot bg-amber-500 animate-pulse"></span>
                    <span id="status-text" class="text-[10px] font-bold text-amber-600 uppercase italic">Canlı Bağlantı</span>
                </div>
            </div>
            <div class="text-right">
                <div id="clock" class="text-3xl font-black text-slate-700 price-font italic">17:08:47</div>
                <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">Her 10 saniyede bir güncellenir</p>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div id="price-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            </div>
    </main>

    <footer class="p-8 text-center text-slate-400 text-[10px] font-bold tracking-[0.4em] uppercase mt-4">
        © 2026 EFE GOLD KUYUMCU - ŞANLIURFA / KARAKÖPRÜ
    </footer>

    <script>
        // --- GÜNCEL AYARLAR ---
        const SATIS_FARKI = 80;  // Satış piyasanın 80 TL üstü
        const ALIS_FARKI = 20;   // Alış piyasanın 20 TL altı
        
        const URUNLER = [
            { id: "gram-altin", ad: "Has Altın (24A)", icon: "fa-coins", type: "gold" },
            { id: "22-ayar-bilezik", ad: "22 Ayar Bilezik", icon: "fa-ring", type: "gold" },
            { id: "18-ayar-altin", ad: "18 Ayar Altın", icon: "fa-gem", type: "gold" },
            { id: "14-ayar-altin", ad: "14 Ayar Altın", icon: "fa-gem", type: "gold" },
            { id: "ceyrek-altin", ad: "Yeni Çeyrek", icon: "fa-dot-circle", type: "gold" },
            { id: "yarim-altin", ad: "Yeni Yarım", icon: "fa-adjust", type: "gold" },
            { id: "tam-altin", ad: "Yeni Tam", icon: "fa-circle", type: "gold" },
            { id: "ata-altin", ad: "Ata Lira", icon: "fa-crown", type: "gold" },
            { id: "USD", ad: "ABD Doları", icon: "fa-dollar-sign", type: "currency" },
            { id: "EUR", ad: "Euro", icon: "fa-euro-sign", type: "currency" }
        ];

        async function fetchData() {
            const statusDot = document.getElementById('sync-status');
            const statusText = document.getElementById('status-text');
            
            try {
                // Cache engellemek için her seferinde farklı bir URL (?v=...)
                const proxy = "https://api.allorigins.win/get?url=";
                const target = encodeURIComponent(`https://finans.truncgil.com/today.json?v=${Date.now()}`);
                
                const response = await fetch(proxy + target);
                const result = await response.json();
                const data = JSON.parse(result.contents);

                if (data["gram-altin"]) {
                    renderUI(data);
                    statusDot.className = 'status-dot bg-green-500';
                    statusText.innerText = "Sistem Güncel";
                    statusText.className = "text-[10px] font-bold text-green-600 uppercase italic";
                }
            } catch (e) {
                statusDot.className = 'status-dot bg-red-500';
                statusText.innerText = "Yenileniyor...";
            }
        }

        function renderUI(data) {
            const grid = document.getElementById('price-grid');
            let html = '';

            URUNLER.forEach(item => {
                const source = data[item.id];
                if (!source) return;

                let buy = parseFloat(source.Alış.replace('.', '').replace(',', '.'));
                let sell = parseFloat(source.Satış.replace('.', '').replace(',', '.'));

                if (item.type === "gold") {
                    buy = buy - ALIS_FARKI;
                    sell = sell + SATIS_FARKI;
                }

                html += `
                    <div class="gold-card p-5 update-flash">
                        <div class="flex justify-between items-center mb-5">
                            <div class="w-10 h-10 bg-amber-50 rounded-xl flex items-center justify-center border border-amber-100 shadow-sm">
                                <i class="fas ${item.icon} text-amber-600 text-lg"></i>
                            </div>
                            <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest text-right">${item.ad}</span>
                        </div>
                        <div class="flex justify-between items-end">
                            <div class="flex flex-col">
                                <span class="text-[8px] text-slate-400 font-black mb-1">ALIŞ</span>
                                <span class="price-font text-lg font-bold text-slate-600 italic">${format(buy)}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-[8px] text-amber-600 font-black mb-1 uppercase italic">SATIŞ</span>
                                <span class="price-font text-2xl font-extrabold text-slate-900 tracking-tighter">${format(sell)}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function format(num) {
            return num.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('tr-TR');
            document.getElementById('date').innerText = now.toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric'});
        }

        setInterval(updateClock, 1000);
        setInterval(fetchData, 10000); // 10 saniyede bir tam güncelleme

        updateClock();
        fetchData();
    </script>
</body>
</html>
